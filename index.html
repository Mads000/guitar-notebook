<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sorell</title>
  <meta name="description" content="Sorell – persönliches Gitarren- und Ukulele-Notizbuch – vollständig lokal und offline.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sorell">
  <script>
    // Bereich oben (Uhrzeit, Akku): „app“ = die App zeichnet darunter, er hat immer die App-Farbe (hell/dunkel).
    // „ios“ = iOS färbt ihn selbst. Wählbar unter Einstellungen → Darstellung.
    (function () {
      var s = 'app';
      try { s = localStorage.getItem('gn-statusbar') || 'app'; } catch (e) {}
      var m = document.createElement('meta');
      m.name = 'apple-mobile-web-app-status-bar-style';
      m.content = s === 'ios' ? 'default' : 'black-translucent';
      document.head.appendChild(m);
    })();
  </script>
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <script>
    // Helles App-Symbol (Einstellungen → Darstellung) – iOS liest es beim Hinzufügen zum Home-Bildschirm
    try { if (localStorage.getItem('gn-icon') === 'light') document.querySelector('link[rel="apple-touch-icon"]').href = 'assets/icons/icon-light-180.png'; } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/view.css">
  <script>
    // Gewähltes Erscheinungsbild vor dem ersten Zeichnen setzen (verhindert Aufblitzen).
    try { var t = localStorage.getItem('gn-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    try { if (localStorage.getItem('gn-font') === 'system') document.documentElement.dataset.font = 'system'; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Sorell benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
