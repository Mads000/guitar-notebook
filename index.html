<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    // App-Größe (Einstellungen → Darstellung), wie Zoomen im Browser
    try { var z = parseFloat(localStorage.getItem('gn-zoom')); if (z === 0.8 || z === 0.9 || z === 1.1) document.querySelector('meta[name="viewport"]').content = 'initial-scale=' + z + ', minimum-scale=' + z + ', maximum-scale=' + z + ', user-scalable=no, viewport-fit=cover'; } catch (e) {}
  </script>
  <title>Sorell</title>
  <meta name="description" content="Sorell – persönliches Gitarren- und Ukulele-Notizbuch – vollständig lokal und offline.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sorell">
  <script>
    // Bereich oben (Uhrzeit, Akku): „app“ = die App zeichnet darunter, er hat immer die App-Farbe (hell/dunkel).
    // „ios“ = iOS färbt ihn selbst. Wählbar unter Einstellungen → Darstellung.
    (function () {
      var s = 'app';
      try { s = localStorage.getItem('gn-statusbar') || 'app'; } catch (e) {}
      var m = document.createElement('meta');
      m.name = 'apple-mobile-web-app-status-bar-style';
      m.content = s === 'ios' ? 'default' : 'black-translucent';
      document.head.appendChild(m);
    })();
  </script>
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/view.css">
  <link rel="stylesheet" href="styles/system.css">
  <link rel="stylesheet" href="styles/sorell.css">
  <script>
    // Design (Einstellungen → Darstellung): Sorell, außer es wurde „Klassisch“ gewählt. Sehr alte Browser bleiben beim klassischen Design.
    try { if (localStorage.getItem('gn-design') !== 'classic' && CSS.supports('selector(&)')) document.documentElement.dataset.design = 'sorell'; } catch (e) {}
    // Gewähltes Erscheinungsbild vor dem ersten Zeichnen setzen (verhindert Aufblitzen).
    try { var a = localStorage.getItem('gn-accent'); if (a === 'orange' || a === 'blue' || a === 'green') document.documentElement.dataset.accent = a; } catch (e) {}
    try { var t = localStorage.getItem('gn-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    try { var f = localStorage.getItem('gn-font'); if (f === 'system' || f === 'allserif') document.documentElement.dataset.font = f; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Sorell benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
