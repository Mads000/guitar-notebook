<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Guitar Notebook: Plektrum mit schwingender Saite auf Schwarz. Ohne Schrift, auch sehr klein erkennbar. -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#1C1610"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="pick" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFC66B"/>
      <stop offset=".5" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E0365F"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC66B" stop-opacity="0"/>
      <stop offset=".22" stop-color="#FFC66B" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#E0365F" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E0365F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M150 512C250 512 300 432 380 432S500 592 580 592 700 432 790 432 830 512 880 512" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Saite außerhalb des Plektrums -->
  <path d="M60 512C150 512 190 512 250 488M774 488C834 512 874 512 964 512" fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round"/>
  <!-- weiches Leuchten -->
  <path d="M512 820C470 820 330 668 268 520C230 430 236 262 512 252C788 262 794 430 756 520C694 668 554 820 512 820Z" fill="url(#pick)" opacity=".45" filter="url(#glow)" mask="url(#cut)"/>
  <path id="art" mask="url(#cut)" fill="url(#pick)"
        d="M512 820C470 820 330 668 268 520C230 430 236 262 512 252C788 262 794 430 756 520C694 668 554 820 512 820Z"/>
</svg>
